plugins {
    id 'com.android.application'
}

android {
    namespace 'es.subelo.movil'
    compileSdk 34

    defaultConfig {
        applicationId 'es.subelo.movil'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    // Misma firma que los APK ya compilados: así puedes actualizar sin desinstalar.
    signingConfigs {
        subelo {
            storeFile rootProject.file(System.getenv('KEYSTORE') ?: 'firma/subelo.jks')
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias 'subelo'
            keyPassword System.getenv('KEYSTORE_PASS')
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.subelo }
        release {
            minifyEnabled false
            signingConfig signingConfigs.subelo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
