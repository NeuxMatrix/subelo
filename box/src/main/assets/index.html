<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Súbelo · Disco de casa</title>
<script>
  // Modo oscuro: lo que elijas se recuerda en este navegador; si no eliges, sigue al sistema.
  (function () {
    var t = null; try { t = localStorage.getItem('subelo-tema'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  @font-face { font-family: "Archivo Black"; src: url(/static/ArchivoBlack.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Space Grotesk"; src: url(/static/SpaceGrotesk-Medium.ttf) format("truetype"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Space Grotesk"; src: url(/static/SpaceGrotesk-Bold.ttf) format("truetype"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Space Mono"; src: url(/static/SpaceMono-Bold.ttf) format("truetype"); font-weight: 700; font-display: swap; }
  :root { --purple:#7B2FF7; --orange:#FF6B1A; --black:#111; --paper:#FFF4E6; --snow:#fff; --ink:#111; --cream:#FFF4E6; --surface:#fff; --lilac:#E4D6FF; --peach:#FFD9C2; --red:#E5322D; --b:3px solid var(--ink); --sh:5px 5px 0 var(--ink); color-scheme: light; }
  html[data-theme=dark] { --ink:#F3EADF; --cream:#16121C; --surface:#241D2E; --lilac:#2E2148; --peach:#47291A; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 500; background: var(--cream); color: var(--ink); margin: 0; }
  .mono { font-family: "Space Mono", ui-monospace, monospace; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  header { position: sticky; top: 0; z-index: 5; background: var(--cream); border-bottom: var(--b); }
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--black); color: var(--paper); flex-wrap: wrap; }
  .top img { width: 46px; height: 46px; border: 3px solid var(--paper); }
  h1 { font-family: "Archivo Black", Impact, sans-serif; font-size: 2rem; margin: 0; line-height: 1; letter-spacing: .01em; text-shadow: 3px 3px 0 var(--purple); }
  #info { margin-left: auto; font-size: .78rem; background: var(--orange); color: var(--black); padding: 6px 10px; border: 2px solid var(--paper); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tools { padding: 12px 16px 14px; }
  #crumbs { margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; }
  #crumbs a { color: var(--ink); text-decoration: none; background: var(--surface); padding: 4px 10px; border: 2px solid var(--ink); cursor: pointer; }
  #crumbs a:last-child { background: var(--purple); color: #fff; }
  #crumbs a:hover { background: var(--orange); color: var(--black); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; }
  button, label.btn { font-family: "Space Mono", ui-monospace, monospace; font-weight: 700; text-transform: uppercase; font-size: .85rem; background: var(--surface); color: var(--ink); border: var(--b); box-shadow: var(--sh); padding: 9px 13px; cursor: pointer; transition: transform .06s, box-shadow .06s; border-radius: 0; }
  button:hover, label.btn:hover { background: var(--lilac); }
  button:active, label.btn:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--ink); }
  button:focus-visible, label.btn:focus-within { outline: 3px solid var(--orange); outline-offset: 3px; }
  .main { background: var(--orange) !important; color: var(--black) !important; }
  .alt { background: var(--purple) !important; color: #fff !important; }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  input[type=file] { display: none; }
  main { padding: 20px 16px 120px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
  .tile { background: var(--surface); border: var(--b); box-shadow: var(--sh); cursor: pointer; position: relative; transition: transform .06s, box-shadow .06s; }
  .tile:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
  .tile.sel { background: var(--orange); color: var(--black); box-shadow: 7px 7px 0 var(--purple); }
  .tile .img { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--cream); border-bottom: var(--b); font-family: "Archivo Black", sans-serif; font-size: 1.4rem; overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .name { padding: 7px 9px 2px; font-size: .82rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .meta { padding: 0 9px 8px; font-size: .68rem; }
  .tile input { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; accent-color: var(--purple); }
  .tile .play { position: absolute; top: 38%; left: 50%; transform: translate(-50%,-50%); width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: var(--orange); border: var(--b); box-shadow: 3px 3px 0 var(--ink); font-size: 1.1rem; color: var(--black); }
  .folder { background: var(--purple); color: #fff; }
  .folder .img { background: var(--purple); color: var(--paper); border-bottom: 3px solid var(--ink); padding: 10px; text-align: center; word-break: break-word; text-transform: uppercase; }
  .folder .name, .folder .meta { color: var(--paper); }
  #empty { padding: 40px 16px; text-align: center; border: 3px dashed var(--ink); background: var(--surface); }
  #drop { display: none; position: fixed; inset: 0; background: rgba(123,47,247,.85); border: 10px solid var(--ink); z-index: 20; align-items: center; justify-content: center; font-family: "Archivo Black", sans-serif; font-size: 2.4rem; color: var(--paper); text-transform: uppercase; text-align: center; padding: 20px; }
  #queue { position: fixed; right: 16px; bottom: 16px; width: min(400px, calc(100vw - 32px)); background: var(--cream); border: var(--b); box-shadow: 8px 8px 0 var(--purple); padding: 12px 14px; display: none; z-index: 10; }
  #queue .t { font-size: .8rem; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog { height: 18px; border: var(--b); background: var(--surface); }
  .prog div { height: 100%; width: 0; background: repeating-linear-gradient(45deg, var(--orange) 0 10px, #ff8a47 10px 20px); border-right: 3px solid var(--ink); }
  #qlog { white-space: pre-line; font-size: .72rem; max-height: 90px; overflow: auto; margin-top: 8px; }
  #viewer { display: none; position: fixed; inset: 0; background: var(--black); z-index: 30; align-items: center; justify-content: center; }
  #viewer img, #viewer video { max-width: calc(100vw - 40px); max-height: calc(100vh - 110px); border: 4px solid var(--paper); box-shadow: 10px 10px 0 var(--purple); }
  #viewer .top { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--black); border-bottom: 3px solid var(--paper); }
  #viewer .top span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--paper); font-size: .85rem; }
  #viewer .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 1.6rem; padding: 10px 16px; }
  #viewer .nav:active { transform: translate(5px, calc(-50% + 5px)); }
  #theme { background: var(--paper); color: var(--black); border-color: var(--paper); box-shadow: 4px 4px 0 var(--purple); padding: 7px 11px; }
  #theme:active { box-shadow: 0 0 0 var(--purple); }
  #who { background: var(--purple); color: var(--snow); border: 2px solid var(--paper); padding: 6px 10px; font-size: .78rem; }
  #logout { padding: 7px 11px; }
  #login { display: none; position: fixed; inset: 0; z-index: 40; background: var(--cream); overflow: auto; padding: 28px 18px; }
  #login .box { max-width: 560px; margin: 0 auto; }
  #login img { width: 72px; height: 72px; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
  #login h2 { font-family: "Archivo Black", Impact, sans-serif; font-size: 2.6rem; text-transform: uppercase; margin: 26px 0 4px; line-height: 1; }
  #login .sub { font-size: .8rem; margin-bottom: 18px; }
  .who { display: block; width: 100%; text-align: left; margin: 0 0 22px; padding: 18px 22px 20px; box-shadow: 7px 7px 0 var(--ink); }
  .who b { display: block; font-family: "Archivo Black", Impact, sans-serif; font-size: 2.4rem; font-weight: 400; text-transform: uppercase; letter-spacing: 0; }
  .who span { font-size: .8rem; }
  .who.u0 { background: var(--orange) !important; color: var(--black) !important; }
  .who.u1 { background: var(--purple) !important; color: var(--snow) !important; }
  #pwForm { display: none; border: var(--b); box-shadow: 7px 7px 0 var(--ink); background: var(--surface); padding: 18px; }
  #pwForm h3 { font-family: "Archivo Black", Impact, sans-serif; text-transform: uppercase; font-size: 1.5rem; margin: 0 0 6px; }
  #pwForm input { display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 1.05rem; padding: 11px 12px; margin: 12px 0 0; border: var(--b); background: var(--cream); color: var(--ink); border-radius: 0; }
  #pwForm input[hidden] { display: none; }
  #pwForm input:focus { outline: 3px solid var(--orange); outline-offset: 2px; }
  #pwForm .row { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  #pwErr { color: var(--red); font-weight: 700; margin-top: 10px; min-height: 1.2em; }
  #prev { left: 14px; } #next { right: 18px; }
  @media (max-width: 600px) { h1 { font-size: 1.5rem; } .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; } #info { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="/static/logo.png" alt="">
    <h1>SÚBELO</h1>
    <div id="info" class="mono">Conectando…</div>
    <span id="who" class="mono" hidden></span>
    <button id="logout" hidden>Salir</button>
    <button id="theme" title="Cambiar modo claro / oscuro"></button>
  </div>
  <div class="tools">
    <div id="crumbs" class="mono"></div>
    <div class="bar">
      <label class="btn main">⬆ Subir fotos<input type="file" id="files" multiple></label>
      <label class="btn">⬆ Subir carpeta<input type="file" id="folder" webkitdirectory multiple></label>
      <button id="mk">+ Carpeta</button>
      <button id="selAll">Seleccionar todo</button>
      <button id="dlSel" class="alt" disabled>⬇ Descargar</button>
      <button id="dlAll">⬇ Carpeta .zip</button>
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="empty" class="mono" hidden>Carpeta vacía · arrastra aquí fotos o carpetas</div>
</main>
<div id="drop">Suelta para subir ⬆</div>
<div id="queue"><div class="t mono" id="qtitle"></div><div class="prog"><div id="qbar"></div></div><div id="qlog" class="mono"></div></div>
<div id="viewer">
  <div class="top"><span id="vname" class="mono"></span><button id="vdl" class="main">⬇ Descargar</button><button id="vclose">✕</button></div>
  <button class="nav" id="prev">‹</button><div id="vbody"></div><button class="nav" id="next">›</button>
</div>
<div id="login">
  <div class="box">
    <div style="display:flex;align-items:center;justify-content:space-between"><img src="/static/logo.png" alt="Súbelo"><button id="theme2" class="mono"></button></div>
    <h2>¿Quién eres?</h2>
    <div class="sub mono">CADA UNO VE SOLO SU CARPETA DEL DISCO</div>
    <div id="whoList"></div>
    <form id="pwForm" autocomplete="on">
      <h3 id="pwTitle"></h3>
      <div id="pwHelp"></div>
      <input type="text" id="pwUser" autocomplete="username" hidden>
      <input type="password" id="pw1" autocomplete="current-password">
      <input type="password" id="pw2" autocomplete="new-password" placeholder="Repítela">
      <div id="pwErr"></div>
      <div class="row"><button type="submit" class="main">Entrar</button><button type="button" id="pwBack">‹ Volver</button></div>
    </form>
  </div>
</div>
<form id="zipForm" method="POST" action="/api/zip" style="display:none"></form>
<script>
try { localStorage.removeItem('subelo-pin'); } catch (e) {}
let path = '';
let files = [];
const selected = new Set();
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const isImg = n => /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(n);
const isVid = n => /\.(mp4|mov|m4v|3gp|webm|mkv|avi)$/i.test(n);
const join = (a, b) => a ? a + '/' + b : b;
const fmt = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const fileUrl = (n, dl) => '/api/file?path=' + enc(path) + '&name=' + enc(n) + (dl ? '&download=1' : '');

async function api(url, opts = {}) {
  const r = await fetch(url, Object.assign({credentials: 'same-origin'}, opts));
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error('Tienes que entrar con tu usuario'); }
  if (!r.ok) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
let user = null, loginUser = null, loginNew = false, minLen = 4;
async function showLogin() {
  $('login').style.display = 'block';
  $('pwForm').style.display = 'none';
  const list = $('whoList'); list.innerHTML = ''; list.style.display = 'block';
  let j;
  try { j = await (await fetch('/api/users', {credentials: 'same-origin'})).json(); }
  catch (e) { list.textContent = 'No se puede hablar con el box.'; return; }
  minLen = j.minLength || 4;
  j.users.forEach((u, i) => {
    const b = document.createElement('button');
    b.className = 'who u' + i;
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = u.name;
    b.querySelector('span').textContent = u.hasPassword ? '▸ Entrar' : '▸ Primera vez: crea tu contraseña';
    b.onclick = () => askPassword(u.name, !u.hasPassword);
    list.appendChild(b);
  });
}
function askPassword(name, isNew) {
  loginUser = name; loginNew = isNew;
  $('whoList').style.display = 'none';
  $('pwForm').style.display = 'block';
  $('pwTitle').textContent = isNew ? 'Hola, ' + name + ': crea tu contraseña' : 'Hola, ' + name;
  $('pwHelp').textContent = isNew
    ? 'Es la primera vez que entras. Inventa una contraseña (mínimo ' + minLen + ' caracteres). Solo tú podrás ver tu carpeta.'
    : 'Escribe tu contraseña.';
  $('pwUser').value = name;
  $('pw1').value = ''; $('pw2').value = ''; $('pwErr').textContent = '';
  $('pw1').placeholder = isNew ? 'Contraseña nueva' : 'Contraseña';
  $('pw1').autocomplete = isNew ? 'new-password' : 'current-password';
  $('pw2').style.display = isNew ? 'block' : 'none';
  $('pw1').focus();
}
$('pwBack').onclick = () => showLogin();
$('pwForm').onsubmit = async e => {
  e.preventDefault();
  const p = $('pw1').value;
  if (p.length < minLen) { $('pwErr').textContent = 'Mínimo ' + minLen + ' caracteres.'; return; }
  if (loginNew && p !== $('pw2').value) { $('pwErr').textContent = 'Las dos contraseñas no coinciden.'; return; }
  const body = new URLSearchParams({user: loginUser, password: p});
  const r = await fetch('/api/login', {method: 'POST', body, credentials: 'same-origin'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('pwErr').textContent = j.error || 'No se pudo entrar.'; return; }
  $('login').style.display = 'none';
  path = ''; selected.clear(); load();
};
$('logout').onclick = async () => {
  await fetch('/api/logout', {method: 'POST', credentials: 'same-origin'}).catch(() => {});
  user = null; $('grid').innerHTML = ''; showLogin();
};
function crumbs() {
  const c = $('crumbs'); c.innerHTML = '';
  const parts = path ? path.split('/') : [];
  const add = (label, p) => { const a = document.createElement('a'); a.textContent = label; a.onclick = () => go(p); c.appendChild(a); };
  add('■ ' + (user || 'Disco'), '');
  parts.forEach((x, i) => { c.appendChild(document.createTextNode('›')); add(x, parts.slice(0, i + 1).join('/')); });
}
function go(p) { path = p; selected.clear(); load(); }
async function load() {
  try {
    const info = await api('/api/info');
    if (!info.user) { $('who').hidden = $('logout').hidden = true; showLogin(); return; }
    user = info.user;
    $('who').textContent = '👤 ' + user; $('who').hidden = $('logout').hidden = false;
    $('info').textContent = info.available
      ? (info.storage || '') + (info.free >= 0 ? ' · libre ' + fmt(info.free) + ' de ' + fmt(info.total) : '')
      : 'El disco no está disponible en el box.';
    const j = await api('/api/list?path=' + enc(path));
    files = j.files;
    crumbs();
    render(j.folders);
  } catch (e) { $('info').textContent = e.message; }
}
function render(folders) {
  const g = $('grid'); g.innerHTML = '';
  folders.forEach(f => {
    const t = document.createElement('div'); t.className = 'tile folder';
    t.innerHTML = '<div class="img"></div><div class="name mono">▸ Carpeta</div>';
    t.querySelector('.img').textContent = f;
    t.onclick = () => go(join(path, f));
    g.appendChild(t);
  });
  files.forEach((f, i) => {
    const t = document.createElement('div'); t.className = 'tile' + (selected.has(f.name) ? ' sel' : '');
    const media = isImg(f.name) || isVid(f.name);
    const ext = (f.name.split('.').pop() || '?').toUpperCase();
    t.innerHTML = '<input type="checkbox"><div class="img">' + (media ? '' : ext) + '</div><div class="name"></div><div class="meta mono"></div>';
    if (media) {
      const img = document.createElement('img'); img.loading = 'lazy';
      img.src = '/api/thumb?path=' + enc(path) + '&name=' + enc(f.name);
      img.onerror = () => { img.remove(); if (!isVid(f.name)) t.querySelector('.img').textContent = 'FOTO'; };
      t.querySelector('.img').appendChild(img);
      if (isVid(f.name)) t.insertAdjacentHTML('beforeend', '<div class="play">▶</div>');
    }
    t.querySelector('.name').textContent = f.name;
    t.querySelector('.meta').textContent = fmt(f.size) + (f.mtime ? ' · ' + new Date(f.mtime).toLocaleDateString() : '');
    const cb = t.querySelector('input'); cb.checked = selected.has(f.name);
    cb.onclick = ev => { ev.stopPropagation(); toggle(f.name, t, cb.checked); };
    t.onclick = () => openViewer(i);
    g.appendChild(t);
  });
  $('empty').hidden = folders.length + files.length > 0;
  updateSel();
}
function toggle(n, t, on) { on ? selected.add(n) : selected.delete(n); t.classList.toggle('sel', on); updateSel(); }
function updateSel() {
  $('dlSel').disabled = selected.size === 0;
  $('dlSel').textContent = '⬇ Descargar' + (selected.size ? ' (' + selected.size + ')' : '');
}
$('selAll').onclick = () => {
  const all = selected.size < files.length;
  selected.clear(); if (all) files.forEach(f => selected.add(f.name));
  document.querySelectorAll('.tile:not(.folder)').forEach((t, i) => { t.classList.toggle('sel', all); t.querySelector('input').checked = all; });
  updateSel();
};
function zip(names) {
  const f = $('zipForm'); f.innerHTML = '';
  const add = (k, v) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i); };
  add('path', path); names.forEach(n => add('name', n));
  f.submit();
}
$('dlSel').onclick = () => {
  const names = [...selected];
  if (names.length === 1) { location.href = fileUrl(names[0], true); return; }
  zip(names);
};
$('dlAll').onclick = () => { if (files.length) zip([]); };
$('mk').onclick = async () => {
  const n = prompt('Nombre de la nueva carpeta:');
  if (!n) return;
  const np = join(path, n.replace(/\//g, '-'));
  try { await api('/api/mkdir?path=' + enc(np), {method: 'POST'}); go(np); } catch (e) { alert(e.message); }
};

// ---------- visor ----------
let vi = -1;
function openViewer(i) {
  vi = i; const f = files[i];
  if (!isImg(f.name) && !isVid(f.name)) { location.href = fileUrl(f.name, true); return; }
  $('vname').textContent = f.name + ' · ' + (i + 1) + '/' + files.length;
  const b = $('vbody'); b.innerHTML = '';
  const el = document.createElement(isVid(f.name) ? 'video' : 'img');
  if (isVid(f.name)) { el.controls = true; el.autoplay = true; }
  el.src = fileUrl(f.name, false);
  b.appendChild(el);
  $('viewer').style.display = 'flex';
}
function closeViewer() { $('vbody').innerHTML = ''; $('viewer').style.display = 'none'; vi = -1; }
function step(d) {
  let i = vi;
  do { i += d; } while (i >= 0 && i < files.length && !isImg(files[i].name) && !isVid(files[i].name));
  if (i >= 0 && i < files.length) openViewer(i);
}
$('vclose').onclick = closeViewer;
$('vdl').onclick = () => { location.href = fileUrl(files[vi].name, true); };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (vi < 0) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

// ---------- subidas ----------
const queue = []; let running = false, total = 0, doneN = 0;
function setBar(f) { $('qbar').style.width = Math.round(Math.min(1, f) * 100) + '%'; }
function qlog(t) { const l = $('qlog'); l.textContent = t + '\n' + l.textContent; }
function enqueue(list) {  // list: [{file, dir}]
  if (!list.length) return;
  queue.push(...list); total += list.length;
  $('queue').style.display = 'block';
  if (!running) runQueue();
}
function put(url, file, onprog) {
  return new Promise((ok, ko) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.upload.onprogress = e => onprog(e.loaded / (e.total || 1));
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} x.status < 300 ? ok(j) : ko(new Error(j.error || 'Error ' + x.status)); };
    x.onerror = () => ko(new Error('Se cortó la conexión'));
    x.send(file);
  });
}
async function runQueue() {
  running = true;
  const startPath = path;
  while (queue.length) {
    const {file, dir} = queue.shift(); doneN++;
    $('qtitle').textContent = `Subiendo ${doneN} de ${total}: ${file.name}`;
    try {
      const q = 'path=' + enc(dir) + '&name=' + enc(file.name);
      const ex = await api('/api/exists?' + q);
      if (ex.exists && ex.size === file.size) { qlog('ya estaba: ' + file.name); continue; }
      const r = await put('/api/upload?' + q + '&size=' + file.size + '&mtime=' + file.lastModified, file,
        p => setBar((doneN - 1 + p) / total));
      qlog('subida: ' + r.name);
    } catch (e) { qlog('ERROR ' + file.name + ': ' + e.message); }
    setBar(doneN / total);
  }
  $('qtitle').textContent = `Terminado: ${total} archivos`;
  running = false; total = 0; doneN = 0;
  if (path === startPath) load();
}
$('files').onchange = ev => { enqueue([...ev.target.files].map(f => ({file: f, dir: path}))); ev.target.value = ''; };
$('folder').onchange = ev => {
  enqueue([...ev.target.files].filter(f => !f.name.startsWith('.')).map(f => {
    const rel = (f.webkitRelativePath || f.name).split('/').slice(0, -1).join('/');
    return {file: f, dir: join(path, rel)};
  }));
  ev.target.value = '';
};
// arrastrar y soltar (también carpetas)
let dragN = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('drop').style.display = 'flex'; });
document.addEventListener('dragleave', e => { if (--dragN <= 0) { dragN = 0; $('drop').style.display = 'none'; } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault(); dragN = 0; $('drop').style.display = 'none';
  const base = path, out = [];
  const walk = (entry, dir) => new Promise(res => {
    if (entry.isFile) entry.file(f => { if (!f.name.startsWith('.')) out.push({file: f, dir}); res(); }, () => res());
    else if (entry.isDirectory) {
      const rd = entry.createReader(), all = [];
      const more = () => rd.readEntries(async ents => {
        if (!ents.length) { for (const x of all) await walk(x, join(dir, entry.name)); res(); }
        else { all.push(...ents); more(); }
      }, () => res());
      more();
    } else res();
  });
  const items = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (items.length) { for (const it of items) await walk(it, base); }
  else out.push(...[...e.dataTransfer.files].map(f => ({file: f, dir: base})));
  enqueue(out);
});
load();

function themeLabel() { $('theme').textContent = $('theme2').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀ Claro' : '☾ Oscuro'; }
$('theme').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('subelo-tema', t); } catch (e) {}
  themeLabel();
};
$('theme2').onclick = () => $('theme').onclick();
themeLabel();
</script>
