<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Súbelo · Mapa de fotos</title>
<script>
  // Mismo archivo en el box (navegador) y en la app del móvil (que pasa ?app=1&tema=oscuro|claro);
  // la web del box lo mete en su pestaña «Mapa» con ?embed=1&tema=…. Con &pick=1 no enseña las
  // fotos: sirve para elegir dónde se hizo una (📍 Ubicación) y se lo devuelve a quien lo abrió.
  (function () {
    var q = new URLSearchParams(location.search), t = null;
    window.EN_APP = q.get('app') === '1';
    window.EMBED = q.get('embed') === '1'; // dentro de la web del box (pestaña «Mapa»)
    window.PICK = q.get('pick') === '1';
    if (EN_APP || EMBED) t = q.get('tema') === 'oscuro' ? 'dark' : 'light';
    else { try { t = localStorage.getItem('subelo-tema'); } catch (e) {} }
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="/static/leaflet.css">
<link rel="stylesheet" href="/static/markercluster.css">
<style>
  @font-face { font-family: "Archivo Black"; src: url(/static/ArchivoBlack.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Space Grotesk"; src: url(/static/SpaceGrotesk-Medium.ttf) format("truetype"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Space Mono"; src: url(/static/SpaceMono-Bold.ttf) format("truetype"); font-weight: 700; font-display: swap; }
  :root { --purple:#7B2FF7; --orange:#FF6B1A; --black:#111; --paper:#FFF4E6; --ink:#111; --cream:#FFF4E6; --surface:#fff; --lilac:#E4D6FF; color-scheme: light; }
  html[data-theme=dark] { --ink:#F3EADF; --cream:#16121C; --surface:#241D2E; --lilac:#2E2148; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 500; background: var(--cream); color: var(--ink); }
  .mono { font-family: "Space Mono", ui-monospace, monospace; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--black); color: var(--paper); border-bottom: 3px solid var(--ink); flex-wrap: wrap; }
  h1 { font-family: "Archivo Black", Impact, sans-serif; font-size: 1.6rem; margin: 0; line-height: 1; text-shadow: 3px 3px 0 var(--purple); text-transform: uppercase; }
  #stat { margin-left: auto; font-size: .72rem; background: var(--orange); color: var(--black); padding: 5px 9px; border: 2px solid var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  button, a.btn { font-family: "Space Mono", ui-monospace, monospace; font-weight: 700; text-transform: uppercase; font-size: .78rem; background: var(--paper); color: var(--black); border: 3px solid var(--paper); padding: 6px 10px; cursor: pointer; border-radius: 0; text-decoration: none; }
  #years { display: flex; gap: 8px; padding: 9px 12px; overflow-x: auto; background: var(--cream); border-bottom: 3px solid var(--ink); scrollbar-width: none; }
  #years:empty { display: none; }
  #years button { background: var(--surface); color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); flex: none; }
  #years button.on { background: var(--purple); color: #fff; }
  #years .sep { flex: none; width: 3px; background: var(--ink); margin: 0 4px; }
  #years .k { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 2px solid var(--ink); vertical-align: -1px; }
  #map { flex: 1; min-height: 0; background: var(--cream); }
  .leaflet-container { font-family: "Space Grotesk", system-ui, sans-serif; background: var(--cream); }
  .leaflet-bar a { background: var(--surface); color: var(--ink); border-bottom-color: var(--ink); font-family: "Archivo Black", sans-serif; }
  .leaflet-touch .leaflet-bar { border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 0; }
  .leaflet-touch .leaflet-bar a:first-child, .leaflet-touch .leaflet-bar a:last-child { border-radius: 0; }
  .leaflet-control-attribution { font-size: 10px; }
  html[data-theme=dark] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); }
  /* un punto redondo por sitio con fotos (el número: cuántas); morado lo tuyo, naranja lo del otro */
  .hit { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .dot { border-radius: 50%; background: var(--purple); color: #fff; border: 3px solid #fff; box-shadow: 0 0 0 2px #111, 2px 3px 0 2px #111;
    display: flex; align-items: center; justify-content: center; font: 700 11px/1 "Space Mono", monospace; transition: transform .12s; }
  .dot.otro { background: var(--orange); color: #111; }
  .dot.mix { box-shadow: 0 0 0 4px var(--orange), 2px 3px 0 4px #111; }
  .hit:hover .dot, .hit:focus-visible .dot { transform: scale(1.18); }
  .leaflet-tooltip.tip { background: var(--black); color: var(--paper); border: 2px solid var(--paper); border-radius: 0; box-shadow: none; font: 700 .72rem "Space Mono", monospace; padding: 4px 8px; }
  .leaflet-tooltip.tip::before { display: none; }
  /* al tocar un punto con fotos de varias carpetas: cuáles son */
  #sheet { display: none; position: absolute; left: 12px; bottom: 12px; z-index: 700; width: min(440px, calc(100% - 24px)); max-height: 60%; flex-direction: column;
    background: var(--surface); border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--purple); }
  #sheet .head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 3px solid var(--ink); }
  #sheet .head span { flex: 1; font-size: .78rem; }
  #sheet .head button { border-color: var(--ink); background: var(--surface); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  #shList { overflow: auto; }
  #shList .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 2px solid var(--ink); cursor: pointer; }
  #shList .row:last-child { border-bottom: 0; }
  #shList .row:hover { background: var(--lilac); }
  #shList .k { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid var(--ink); }
  #shList .t { flex: 1; min-width: 0; }
  #shList .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #shList .t small { display: block; font: 700 .68rem "Space Mono", monospace; opacity: .75; }
  #shList .row button { flex: none; border-color: var(--ink); background: var(--surface); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 5px 8px; }
  #shList .row button.main { color: #111; }
  @media (max-width: 600px) { #sheet { left: 0; right: 0; bottom: 0; width: 100%; max-height: 70%; box-shadow: 0 -6px 0 var(--purple); border-width: 3px 0 0; } }
  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 500; width: min(420px, calc(100vw - 32px)); background: var(--surface); border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--purple); padding: 18px 18px 16px; display: none; }
  #msg h2 { font-family: "Archivo Black", sans-serif; text-transform: uppercase; margin: 0 0 8px; font-size: 1.3rem; }
  #msg p { margin: 0; line-height: 1.4; }
  #wrap { position: relative; flex: 1; display: flex; min-height: 0; }
  #viewer { display: none; position: fixed; inset: 0; background: #111; z-index: 1000; flex-direction: column; }
  #viewer .bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 3px solid var(--paper); color: var(--paper); background: #111; position: relative; z-index: 2; flex-wrap: wrap; }
  #viewer .bar span { flex: 1; min-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .8rem; }
  #viewer .stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #vbody { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px 18px 22px 16px; }
  #viewer img, #viewer video { max-width: 100%; max-height: 100%; object-fit: contain; border: 4px solid var(--paper); box-shadow: 10px 10px 0 var(--purple); }
  #viewer .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 1.5rem; padding: 8px 14px; z-index: 2; }
  /* elegir dónde se hizo */
  #pickTop { display: none; gap: 8px; padding: 9px 12px; background: var(--cream); border-bottom: 3px solid var(--ink); flex-wrap: wrap; align-items: center; }
  #pickTop input { flex: 1; min-width: 160px; font: 500 1rem "Space Grotesk", system-ui, sans-serif; padding: 8px 10px; border: 3px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 0; }
  #pickTop button, #pickBar button { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); background: var(--surface); color: var(--ink); }
  #found { display: none; position: absolute; left: 12px; right: 12px; top: 8px; z-index: 600; background: var(--surface); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--purple); max-height: 50%; overflow: auto; }
  #found div { padding: 10px 12px; border-bottom: 2px solid var(--ink); cursor: pointer; }
  #found div:hover { background: var(--lilac); }
  #pickBar { display: none; gap: 10px; padding: 10px 12px; background: var(--black); border-top: 3px solid var(--ink); flex-wrap: wrap; align-items: center; }
  #pickBar .hint { color: var(--paper); flex: 1; min-width: 150px; font-size: .72rem; }
  #pickBar button:disabled { opacity: .45; cursor: default; }
  #pickBar #pickCon { background: var(--purple) !important; border-color: var(--purple) !important; color: #fff; }
  #pickBar button.was { outline: 3px dashed var(--paper); outline-offset: 2px; }
  .pin { font-size: 40px; line-height: 40px; text-align: center; filter: drop-shadow(2px 3px 0 #111); }
  #prev { left: 10px; } #next { right: 10px; }
  .main { background: var(--orange) !important; border-color: var(--orange) !important; }
</style>
</head>
<body>
<div class="top">
  <a class="btn" id="back" href="/">‹ Volver</a>
  <h1>Mapa</h1>
  <span id="stat" class="mono">Cargando…</span>
  <button id="theme" class="mono"></button>
</div>
<div id="years" class="mono"></div>
<form id="pickTop"><input id="pq" type="search" placeholder="Busca un sitio (Toledo, Plaza Mayor Madrid…) o pega coordenadas" autocomplete="off"><button class="mono">Buscar</button></form>
<div id="wrap">
  <div id="map"></div>
  <div id="found"></div>
  <div id="msg"><h2 id="msgT"></h2><p id="msgP"></p></div>
  <div id="sheet"><div class="head mono"><span id="shT"></span><button id="shX" class="mono" title="Cerrar">✕</button></div><div id="shList"></div></div>
</div>
<div id="pickBar"><span class="hint mono" id="pickHint">Toca en el mapa donde se hizo</span><button id="pickClear" class="mono" hidden>↺ Quitar la puesta a mano</button><button id="pickNo" class="mono">Cancelar</button><button id="pickOk" class="mono main" disabled>✓ Guardar aquí</button><button id="pickCon" class="mono main" disabled hidden></button></div>
<div id="viewer">
  <div class="bar mono"><span id="vname"></span><a class="btn" id="vdir">📁 Carpeta</a><button id="vgeo" hidden>📍 Cambiar sitio</button><a class="btn main" id="vdl" download>⬇</a><button id="vclose">✕ Cerrar</button></div>
  <div class="stage"><div id="vbody"></div><button class="nav" id="prev">‹</button><button class="nav" id="next">›</button></div>
</div>
<script src="/static/leaflet.js"></script>
<script src="/static/markercluster.js"></script>
<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const VIDEO = /\.(mp4|mov|3gp|mkv|webm|m4v|avi)$/i;
const MAPA_COMUN = '🗺 Mapa común';
const dark = () => document.documentElement.getAttribute('data-theme') === 'dark';
const fmt = n => n.toLocaleString('es-ES');
let all = [], year = '', whose = '', fitted = false, layer = null, lastKey = '', vlist = [], vi = -1, pollT = 0;

if (EN_APP || EMBED) { $('back').hidden = true; $('theme').hidden = true; }
// quien abrió esta página: la web del box (otro marco de la misma dirección) o la app del móvil
function tell(msg) {
  if (EN_APP && window.SubeloApp) {
    if (msg.subelo === 'sitio') SubeloApp.sitio(msg.lat, msg.lon, msg.con || '');
    else if (msg.subelo === 'quitar') SubeloApp.quitar();
    else if (msg.subelo === 'cancelar') SubeloApp.cancelar();
  } else if (EMBED && parent !== window) parent.postMessage(msg, location.origin);
}

// Al tocar el mapa, Leaflet le da el foco. En la web del móvil el mapa es más alto que lo que se ve (la
// cabecera se va al bajar), así que el navegador bajaba la página en mitad del toque y este caía fuera del
// punto: no abría nada. Foco sin mover la página, y los puntos tampoco mueven el mapa al recibirlo.
L.Map.Keyboard.prototype._onMouseDown = function () { if (!this._focused) this._map.getContainer().focus({preventScroll: true}); };
L.Marker.prototype.options.autoPanOnFocus = false;
const map = L.map('map', {zoomControl: true, worldCopyJump: true}).setView([40.2, -3.7], 5);
let tiles = null;
function setTiles() {
  if (tiles) map.removeLayer(tiles);
  // mapa de OpenStreetMap (sin clave); en modo oscuro se invierten los colores
  tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
}
setTiles();

// un punto redondo: más grande cuantas más fotos; morado lo tuyo, naranja lo del otro, morado con aro naranja si hay de los dos
function dot(count, mine, theirs) {
  const size = Math.round(22 + 8 * Math.log10(Math.max(1, count))), box = Math.max(size, 40); // se toca en 40 px aunque se vea más pequeño
  const cls = !mine ? ' otro' : theirs ? ' mix' : '';
  const label = count < 2 ? '' : count < 1000 ? String(count) : (count / 1000).toFixed(count < 10000 ? 1 : 0).replace('.0', '') + 'k';
  return L.divIcon({className: '', iconSize: [box, box], iconAnchor: [box / 2, box / 2],
    html: '<div class="hit"><div class="dot' + cls + '" style="width:' + size + 'px;height:' + size + 'px">' + label + '</div></div>'});
}
// las fotos de un mismo sitio (a unos 10 m) van en un solo punto
function places(list) {
  const by = new Map();
  for (const p of list) {
    const k = p.la.toFixed(4) + ',' + p.lo.toFixed(4);
    let g = by.get(k);
    if (!g) by.set(k, g = {la: p.la, lo: p.lo, items: []});
    g.items.push(p);
  }
  return [...by.values()];
}
const plural = (n, one, many) => fmt(n) + ' ' + (n === 1 ? one : many);
const photos = items => {
  const v = items.filter(p => VIDEO.test(p.n)).length, f = items.length - v;
  return [f ? plural(f, 'foto', 'fotos') : '', v ? plural(v, 'vídeo', 'vídeos') : ''].filter(Boolean).join(' y ');
};
const SHARED = '👥 Compartido conmigo';
// cómo se llama la carpeta para la gente (las rutas especiales, sin el prefijo)
function folderName(d, o) {
  if (d === MAPA_COMUN || d.startsWith(MAPA_COMUN + '/')) return 'De ' + o + (d.split('/').slice(2).join('/') ? ' · ' + d.split('/').slice(2).join('/') : '');
  if (d.startsWith(SHARED + '/')) return d.slice(SHARED.length + 1); // ya dice de quién: «Fer · Toledo»
  return d || 'Carpeta principal';
}
const openable = d => d !== MAPA_COMUN && !d.startsWith(MAPA_COMUN + '/') && (!EN_APP || !!(window.SubeloApp && SubeloApp.carpeta));

// lo que se ve: por año y de quién (todas, las mías o las del otro)
function visible() {
  return all.filter(p => (!year || (p.t || '').startsWith(year))
    && (!whose || (whose === 'mias' ? !p.o : p.o === whose)));
}
function build() {
  const list = visible();
  const key = year + '|' + whose + '|' + list.length;
  if (key === lastKey) return;
  lastKey = key;
  if (layer) map.removeLayer(layer);
  closeSheet();
  layer = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 60, chunkedLoading: true,
    spiderfyOnMaxZoom: false, zoomToBoundsOnClick: false, // nada de abanicos de fotos: se acerca o se dice qué hay
    iconCreateFunction: c => {
      let n = 0, mine = false, theirs = false;
      for (const m of c.getAllChildMarkers()) { n += m.g.items.length; mine = mine || m.g.mine; theirs = theirs || m.g.theirs; }
      return dot(n, mine, theirs);
    }
  });
  layer.on('clusterclick', e => {
    const c = e.layer, b = c.getBounds();
    // cerca del todo (o todos en el mismo sitio): qué carpetas hay; si no, se acerca
    if (map.getZoom() >= 15 || map.getBoundsZoom(b) <= map.getZoom() || b.getNorthEast().distanceTo(b.getSouthWest()) < 200) {
      openPlace([].concat(...c.getAllChildMarkers().map(m => m.g.items)));
    } else c.zoomToBounds({padding: [50, 50]});
  });
  const markers = places(list).map(g => {
    g.mine = g.items.some(p => !p.o); g.theirs = g.items.some(p => p.o);
    const m = L.marker([g.la, g.lo], {icon: dot(g.items.length, g.mine, g.theirs), keyboard: true});
    m.g = g;
    const names = [...new Set(g.items.map(p => folderName(p.d, p.o)))];
    m.bindTooltip(photos(g.items) + ' · ' + names.slice(0, 2).join(', ') + (names.length > 2 ? ' y ' + (names.length - 2) + ' más' : ''),
      {className: 'tip mono', direction: 'top', offset: [0, -14]});
    m.on('click', () => openPlace(g.items));
    return m;
  });
  layer.addLayers(markers);
  map.addLayer(layer);
  if (!fitted && list.length) {
    fitted = true;
    map.fitBounds(L.latLngBounds(list.map(p => [p.la, p.lo])), {padding: [40, 40], maxZoom: 14});
  }
}

function years() {
  const ys = [...new Set(all.map(p => (p.t || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  const others = [...new Set(all.map(p => p.o).filter(Boolean))].sort();
  const box = $('years');
  box.innerHTML = '';
  const add = (label, on, click, color) => {
    const b = document.createElement('button');
    b.textContent = label; b.className = on ? 'on' : ''; b.onclick = click;
    if (color) { const k = document.createElement('span'); k.className = 'k'; k.style.background = color; b.prepend(k); }
    box.appendChild(b);
  };
  if (others.length) { // mapa común: las de los dos, las mías o las del otro (con su color de punto)
    add('👥 Todas', !whose, () => { whose = ''; years(); build(); });
    add('Mías', whose === 'mias', () => { whose = 'mias'; years(); build(); }, 'var(--purple)');
    for (const o of others) add('De ' + o, whose === o, () => { whose = o; years(); build(); }, 'var(--orange)');
  }
  if (ys.length >= 2) {
    if (others.length) { const sep = document.createElement('span'); sep.className = 'sep'; box.appendChild(sep); }
    for (const y of [''].concat(ys)) add(y || 'Todos los años', y === year, () => { year = y; years(); build(); });
  }
}

function message(title, text) {
  $('msg').style.display = title ? 'block' : 'none';
  $('msgT').textContent = title || '';
  $('msgP').textContent = text || '';
}

async function load() {
  let j;
  try {
    const r = await fetch('/api/places', {credentials: 'same-origin', cache: 'no-store'});
    if (r.status === 401 && !EN_APP) { (EMBED ? top : window).location.href = '/'; return; }
    j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  } catch (e) {
    $('stat').textContent = 'Sin conexión';
    message('No se pudo cargar', e.message || String(e));
    clearTimeout(pollT);
    pollT = setTimeout(load, 8000);
    return;
  }
  // o: de quién es (vacío si es tuya); c: compartida en el mapa común
  all = j.places.map(a => ({d: a[0], n: a[1], la: a[2], lo: a[3], t: a[4], s: a[5], m: a[6] === 1, o: a[7] || '', c: a[8] === 1}));
  years();
  build();
  $('stat').textContent = j.scanning
    ? 'Buscando ubicaciones… ' + fmt(j.seen) + ' revisadas'
    : fmt(all.filter(p => !p.o).length) + ' de ' + fmt(j.media) + ' con ubicación'
      + (all.some(p => p.o) ? ' · +' + fmt(all.filter(p => p.o).length) + ' del mapa común' : '');
  if (all.length) message();
  else if (j.scanning) message('Buscando…', 'Estoy leyendo dónde se hizo cada foto. La primera vez tarda un poco; el mapa se va llenando solo.');
  else if (!j.media) message('Aún no hay fotos', 'Cuando subas fotos al box aparecerán aquí, en el sitio donde se hicieron.');
  else message('Ninguna foto tiene ubicación', 'Las fotos solo guardan dónde se hicieron si la cámara del móvil tiene activada la ubicación (en la app Cámara, ajustes › «Guardar ubicación»).');
  clearTimeout(pollT);
  if (j.scanning) pollT = setTimeout(load, 2500);
}
// la web avisa cuando ha cambiado algo (una ubicación puesta a mano): se vuelve a pintar
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.subelo !== 'recargar' || PICK) return;
  lastKey = ''; closeViewer(); load();
});

// ---------- tocar un punto: se abre su carpeta ----------
function openPlace(items) {
  const by = new Map();
  for (const p of items) {
    const k = p.o + '|' + p.d;
    if (!by.has(k)) by.set(k, {d: p.d, o: p.o, items: []});
    by.get(k).items.push(p);
  }
  const groups = [...by.values()].sort((a, b) => b.items.length - a.items.length || a.d.localeCompare(b.d));
  if (groups.length === 1) { // todo de una carpeta: se abre directamente
    if (openable(groups[0].d)) openFolder(groups[0].d); else openPhotos(groups[0].items);
    return;
  }
  $('shT').textContent = photos(items) + ' aquí · en ' + groups.length + ' carpetas';
  const list = $('shList');
  list.innerHTML = '';
  for (const g of groups) {
    const row = document.createElement('div');
    row.className = 'row'; row.tabIndex = 0;
    row.innerHTML = '<span class="k"></span><span class="t"><b></b><small></small></span>';
    row.querySelector('.k').style.background = g.o ? 'var(--orange)' : 'var(--purple)';
    row.querySelector('b').textContent = (openable(g.d) ? '📁 ' : '🔒 ') + folderName(g.d, g.o);
    row.querySelector('small').textContent = photos(g.items) + ' en este sitio';
    const see = document.createElement('button');
    see.className = 'mono'; see.textContent = '▶ Ver';
    see.title = 'Ver solo las de este sitio';
    see.onclick = e => { e.stopPropagation(); openPhotos(g.items); };
    row.appendChild(see);
    row.onclick = () => openable(g.d) ? openFolder(g.d) : openPhotos(g.items);
    row.onkeydown = e => { if (e.key === 'Enter') row.onclick(); };
    list.appendChild(row);
  }
  $('sheet').style.display = 'flex';
  showBottom();
}
// En la web del móvil el mapa es más alto que la pantalla: que se vea la lista de abajo
function showBottom() {
  try {
    const f = EMBED && frameElement, r = f && f.getBoundingClientRect();
    if (r && r.bottom > parent.innerHeight + 1) parent.scrollBy({top: r.bottom - parent.innerHeight, behavior: 'smooth'});
  } catch (e) {}
}
function closeSheet() { $('sheet').style.display = 'none'; }
$('shX').onclick = closeSheet;
map.on('click', () => { if (!PICK) closeSheet(); });

function openFolder(d) {
  closeSheet();
  if (EN_APP) SubeloApp.carpeta(d); // el móvil la abre en «Mis fotos por carpetas»
  else if (EMBED) top.location.hash = '#fotos/' + enc(d); // la web, en «Mis fotos»
  else location.href = '/#fotos/' + enc(d);
}

// ---------- ver fotos (las del otro, o «▶ Ver» las de un sitio) ----------
function openPhotos(items, start) {
  closeSheet();
  const list = items.slice().sort((a, c) => (a.t || '').localeCompare(c.t || '') || a.n.localeCompare(c.n));
  const idx = Math.max(0, start ? list.indexOf(start) : 0);
  if (EN_APP && window.SubeloApp) { SubeloApp.ver(JSON.stringify(list.map(x => [x.d, x.n, x.s, x.o ? 0 : 1, x.o])), idx); return; }
  vlist = list; show(idx);
}
function show(i) {
  if (i < 0 || i >= vlist.length) return;
  vi = i;
  const p = vlist[i], url = '/api/file?path=' + enc(p.d) + '&name=' + enc(p.n);
  const where = p.o ? 'De ' + p.o + ' · ' + p.n : (p.d ? p.d + '/' : '') + p.n;
  $('vname').textContent = (i + 1) + '/' + vlist.length + ' · ' + (p.t || '') + ' · ' + where
    + (p.m ? ' · 📍 puesta a mano' : '') + (!p.o && p.c ? ' · 👥 en el mapa común' : '');
  $('vdl').href = url + '&download=1';
  $('vdir').href = '/#fotos/' + enc(p.d);
  $('vdir').hidden = p.d === MAPA_COMUN || p.d.startsWith(MAPA_COMUN + '/'); // esas no se abren como carpeta
  $('vgeo').hidden = !EMBED || !!p.o; // solo el dueño la cambia de sitio
  $('vbody').innerHTML = '';
  const el = document.createElement(VIDEO.test(p.n) ? 'video' : 'img');
  if (el.tagName === 'VIDEO') { el.controls = true; el.autoplay = true; }
  el.src = url;
  $('vbody').appendChild(el);
  $('viewer').style.display = 'flex';
  $('prev').style.visibility = i > 0 ? 'visible' : 'hidden';
  $('next').style.visibility = i < vlist.length - 1 ? 'visible' : 'hidden';
}
function closeViewer() { $('vbody').innerHTML = ''; $('viewer').style.display = 'none'; vi = -1; }
$('vclose').onclick = closeViewer;
$('vbody').onclick = e => { if (e.target === $('vbody')) closeViewer(); }; // clic fuera de la foto
$('vdir').onclick = e => {
  if (!EMBED || vi < 0) return;
  e.preventDefault();
  top.location.hash = '#fotos/' + enc(vlist[vi].d); // en la web: abre su carpeta en «Mis fotos»
};
$('vgeo').onclick = () => { if (vi >= 0) tell({subelo: 'ubicar', dir: vlist[vi].d, name: vlist[vi].n}); };
$('prev').onclick = () => show(vi - 1);
$('next').onclick = () => show(vi + 1);
document.addEventListener('keydown', e => {
  if (vi < 0) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowLeft') show(vi - 1);
  else if (e.key === 'ArrowRight') show(vi + 1);
});

function themeLabel() { $('theme').textContent = dark() ? '☀' : '☾'; }
$('theme').onclick = () => {
  const t = dark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('subelo-tema', t); } catch (e) {}
  themeLabel();
  setTiles();
};
themeLabel();

// ---------- elegir dónde se hizo (pick=1) ----------
function pickMode() {
  const q = new URLSearchParams(location.search), LAST = 'subelo-ultimo-sitio';
  const n = parseInt(q.get('n') || '1', 10) || 1, folders = parseInt(q.get('carpetas') || '0', 10) || 0;
  const otro = q.get('otro') || '', con = (q.get('con') || '').split(',').filter(Boolean);
  const heredado = (q.get('heredado') || '').split(',').filter(Boolean); // ya la comparte una carpeta de fuera
  $('years').style.display = 'none';
  document.querySelector('h1').textContent = '¿Dónde se hizo?';
  const files = n - folders;
  $('stat').textContent = [files ? (files === 1 ? '1 foto' : files + ' fotos') : '',
    folders ? (folders === 1 ? '1 carpeta' : folders + ' carpetas') : ''].filter(Boolean).join(' y ');
  // para quién: solo para mí, o también en el mapa del otro (marcado: lo que tenía)
  if (otro) {
    $('pickOk').textContent = '✓ Solo yo';
    $('pickCon').textContent = '✓ Con ' + otro;
    $('pickCon').hidden = false;
    if (q.get('manual') === '1') (con.includes(otro) ? $('pickCon') : $('pickOk')).classList.add('was');
  }
  $('pickTop').style.display = 'flex';
  $('pickBar').style.display = 'flex';
  $('pickClear').hidden = q.get('manual') !== '1';
  let pin = null;
  function put(lat, lon, zoom) {
    lon = ((lon + 540) % 360) - 180; // el mapa da la vuelta al mundo: lo dejamos entre -180 y 180
    if (!pin) {
      pin = L.marker([lat, lon], {draggable: true, icon: L.divIcon({className: '', html: '<div class="pin">📍</div>', iconSize: [40, 40], iconAnchor: [20, 38]})}).addTo(map);
      pin.on('dragend', () => hint());
    } else pin.setLatLng([lat, lon]);
    if (zoom) map.setView([lat, lon], zoom); else map.panTo([lat, lon]);
    hint();
  }
  function hint() {
    const ll = pin.getLatLng();
    $('pickHint').textContent = ll.lat.toFixed(5) + ', ' + ll.lng.toFixed(5) + ' · arrastra el 📍 para afinar'
      + (folders ? ' · las fotos sin GPS de la carpeta irán aquí' : '')
      + (otro && heredado.includes(otro) ? ' · está dentro de una carpeta que ya sale en el mapa de ' + otro
        : otro ? ' · ¿solo para ti o también para ' + otro + '?' : '');
    $('pickOk').disabled = $('pickCon').disabled = false;
  }
  map.on('click', e => { $('found').style.display = 'none'; put(e.latlng.lat, e.latlng.lng); });
  const lat = parseFloat(q.get('lat')), lon = parseFloat(q.get('lon'));
  if (!isNaN(lat) && !isNaN(lon)) put(lat, lon, 15);
  else {
    let last = null;
    try { last = JSON.parse(localStorage.getItem(LAST)); } catch (e) {}
    if (last && last.length === 2) map.setView(last, 12); // donde pusiste la última
  }
  $('pickTop').onsubmit = async e => {
    e.preventDefault();
    const text = $('pq').value.trim(), box = $('found');
    if (!text) return;
    // coordenadas («40.4168, -3.7038») o un enlace de Google Maps («…@40.4168,-3.7038,15z»)
    const c = text.match(/(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/);
    if (c && Math.abs(+c[1]) <= 90 && Math.abs(+c[2]) <= 180) { box.style.display = 'none'; put(+c[1], +c[2], 16); return; }
    box.style.display = 'block';
    box.innerHTML = '<div>Buscando…</div>';
    let list;
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=es&q=' + enc(text));
      if (!r.ok) throw new Error('Error ' + r.status);
      list = await r.json();
    } catch (err) {
      box.innerHTML = '<div>No he podido buscar (¿hay internet?). Toca el sitio en el mapa.</div>';
      return;
    }
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<div>No encuentro «' + text.replace(/[<>&]/g, '') + '». Prueba con otro nombre o toca el mapa.</div>'; return; }
    for (const x of list) {
      const d = document.createElement('div');
      d.textContent = x.display_name;
      d.onclick = () => {
        box.style.display = 'none';
        put(+x.lat, +x.lon, x.boundingbox ? null : 16);
        if (x.boundingbox) {
          const b = x.boundingbox.map(Number);
          map.fitBounds([[b[0], b[2]], [b[1], b[3]]], {maxZoom: 17});
        }
      };
      box.appendChild(d);
    }
  };
  function save(withOther) {
    if (!pin) return;
    const ll = pin.getLatLng(), lat = +ll.lat.toFixed(6), lon = +(((ll.lng + 540) % 360) - 180).toFixed(6);
    try { localStorage.setItem(LAST, JSON.stringify([lat, lon])); } catch (e) {}
    $('pickOk').disabled = $('pickCon').disabled = true;
    tell({subelo: 'sitio', lat, lon, con: withOther ? otro : ''});
  }
  $('pickOk').onclick = () => save(false);
  $('pickCon').onclick = () => save(true);
  $('pickClear').onclick = () => tell({subelo: 'quitar'});
  $('pickNo').onclick = () => tell({subelo: 'cancelar'});
  document.addEventListener('keydown', e => { if (e.key === 'Escape') tell({subelo: 'cancelar'}); });
  if (!EN_APP && !EMBED) { $('pickOk').hidden = $('pickCon').hidden = $('pickNo').hidden = $('pickClear').hidden = true; } // suelta: solo para mirar
}
if (PICK) pickMode(); else load();
</script>
