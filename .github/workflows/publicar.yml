# Compila y firma las dos apps y las publica como release de GitHub.
# Las apps del box y del móvil miran la última release y ofrecen actualizarse.
#
# Secretos necesarios (Settings › Secrets and variables › Actions):
#   KEYSTORE_B64   el fichero firma/subelo.jks en base64
#   KEYSTORE_PASS  su contraseña
name: Publicar apps

on:
  push:
    branches: [main]
    paths: ['box/**', 'movil/**', 'compilar-sin-android-studio.sh', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: publicar

jobs:
  publicar:
    runs-on: ubuntu-24.04
    env:
      ANDROID_ALL_URL: https://repo.maven.apache.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Herramientas de Android (sin Android Studio)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner android-sdk-platform-23 zip

      - name: Plataforma Android 14
        uses: actions/cache@v4
        with:
          path: ~/aa/aa14.jar
          key: android-all-14-robolectric-10818077

      - name: Jars para compilar
        run: |
          mkdir -p ~/aa
          [ -f ~/aa/aa14.jar ] || curl -sSL -o ~/aa/aa14.jar "$ANDROID_ALL_URL"
          rm -rf /tmp/jf && jimage extract --dir /tmp/jf --include 'regex:/java.base/java/util/function/.*' "$JAVA_HOME/lib/modules"
          (cd /tmp/jf/java.base && jar cf ~/aa/java-function.jar java/util/function)

      - name: Compilar y firmar
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Faltan los secretos KEYSTORE_B64 y KEYSTORE_PASS"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/subelo.jks"
          export KEYSTORE="$RUNNER_TEMP/subelo.jks"
          export ANDROID_ALL=~/aa/aa14.jar JAVA_FUNCTION=~/aa/java-function.jar
          # versionCode creciente: las versiones hechas a mano llegaron hasta la 5
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) VERSION_NAME="2.$GITHUB_RUN_NUMBER"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          bash compilar-sin-android-studio.sh
          rm -f "$KEYSTORE"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_CODE" apk/Subelo-Servidor-box.apk apk/Subelo-movil.apk \
            --title "Súbelo $VERSION_NAME" \
            --notes "$(git log -1 --pretty=%s)"
